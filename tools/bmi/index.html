<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Calculateur d’IMC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" aria-labelledby="app-title">
    <div class="heading">
      <span class="eyebrow">OUTIL GRATUIT</span>
      <h1 id="app-title">Calculateur d’IMC</h1>
      <p id="intro"></p>
    </div>

    <div class="unit-tabs" role="group" aria-label="Système d’unités">
      <button class="tab active" type="button" data-unit="metric" aria-pressed="true">Métrique</button>
      <button class="tab" type="button" data-unit="imperial" aria-pressed="false">Impérial</button>
    </div>

    <form id="bmi-form" novalidate>
      <div id="metric-fields" class="fields">
        <label><span id="weight-kg-label"></span><input id="weight-kg" type="number" min="20" max="500" step="0.1" inputmode="decimal" placeholder="70" autocomplete="off"></label>
        <label><span id="height-cm-label"></span><input id="height-cm" type="number" min="80" max="250" step="0.1" inputmode="decimal" placeholder="175" autocomplete="off"></label>
      </div>
      <div id="imperial-fields" class="fields hidden">
        <label><span id="weight-lb-label"></span><input id="weight-lb" type="number" min="44" max="1102" step="0.1" inputmode="decimal" placeholder="154" autocomplete="off"></label>
        <label><span id="height-ft-label"></span><input id="height-ft" type="number" min="2" max="8" step="1" inputmode="numeric" placeholder="5" autocomplete="off"></label>
        <label><span id="height-in-label"></span><input id="height-in" type="number" min="0" max="11.9" step="0.1" inputmode="decimal" placeholder="9" autocomplete="off"></label>
      </div>
      <p id="error" class="error" role="alert" aria-live="assertive"></p>
      <div class="actions">
        <button id="calculate" class="primary" type="submit"></button>
        <button id="reset" class="secondary" type="reset"></button>
      </div>
    </form>

    <section id="result" class="result hidden" aria-live="polite" tabindex="-1">
      <span id="your-bmi" class="result-label"></span>
      <strong id="bmi-value"></strong>
      <p id="category"></p>
      <p id="healthy-range" class="range"></p>
    </section>

    <p id="privacy" class="privacy"></p>
    <p id="disclaimer" class="disclaimer"></p>
  </main>
  <script src="../../core/bmi.js"></script>
  <script src="app.js"></script>
</body>
</html>
